---
layout: default
title: "Tags"
permalink: /tags/
---
{%- assign sorted_tags = site.tags | sort -%}
<p class="cmd"><span class="prompt">$</span> ls tags/</p>
<h1 class="page-title">{{ sorted_tags.size }} tags</h1>

<div class="tag-index">
  {%- for tag in sorted_tags %}
  <a href="{{ '/tags/' | append: tag[0] | uri_escape | append: '/' | relative_url }}"><span>{{ tag[0] | escape }}</span><span>{{ tag[1].size }}</span></a>
  {%- endfor %}
</div>
